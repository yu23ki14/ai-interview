<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" fill="none">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <path d="M0 0 L10 3.5 L0 7 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <path d="M0 0 L10 3.5 L0 7 z" fill="#EF4444"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .stage-en { font-size: 10px; fill: rgba(255,255,255,0.8); }
    .stage-ja { font-size: 14px; fill: #fff; font-weight: 600; }
    .stop-label { font-size: 10px; fill: #EF4444; font-weight: 500; }
  </style>

  <!-- Row 1 boxes -->
  <!-- 1. intro -->
  <rect x="20" y="40" width="160" height="64" rx="10" fill="#94A3B8"/>
  <text x="100" y="66" text-anchor="middle" class="stage-en">intro</text>
  <text x="100" y="86" text-anchor="middle" class="stage-ja">導入・同意</text>

  <!-- arrow 1→2 -->
  <line x1="180" y1="72" x2="218" y2="72" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. narrative -->
  <rect x="220" y="40" width="160" height="64" rx="10" fill="#3B82F6"/>
  <text x="300" y="66" text-anchor="middle" class="stage-en">narrative</text>
  <text x="300" y="86" text-anchor="middle" class="stage-ja">自由語り</text>

  <!-- arrow 2→3 -->
  <line x1="380" y1="72" x2="418" y2="72" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. clarify_entry_point -->
  <rect x="420" y="40" width="160" height="64" rx="10" fill="#10B981"/>
  <text x="500" y="66" text-anchor="middle" class="stage-en">clarify_entry_point</text>
  <text x="500" y="86" text-anchor="middle" class="stage-ja">接触経緯</text>

  <!-- arrow 3→4 -->
  <line x1="580" y1="72" x2="618" y2="72" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. clarify_flow -->
  <rect x="620" y="40" width="160" height="64" rx="10" fill="#10B981"/>
  <text x="700" y="66" text-anchor="middle" class="stage-en">clarify_flow</text>
  <text x="700" y="86" text-anchor="middle" class="stage-ja">やりとり</text>

  <!-- Wrap arrow: row 1 end → row 2 start -->
  <path d="M780 72 L830 72 L830 216 L10 216 L10 232 L18 232" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Row 2 boxes -->
  <!-- 5. clarify_harm -->
  <rect x="20" y="200" width="160" height="64" rx="10" fill="#F59E0B"/>
  <text x="100" y="226" text-anchor="middle" class="stage-en">clarify_harm</text>
  <text x="100" y="246" text-anchor="middle" class="stage-ja">被害状況</text>

  <!-- arrow 5→6 -->
  <line x1="180" y1="232" x2="218" y2="232" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6. clarify_psychology -->
  <rect x="220" y="200" width="160" height="64" rx="10" fill="#F59E0B"/>
  <text x="300" y="226" text-anchor="middle" class="stage-en">clarify_psychology</text>
  <text x="300" y="246" text-anchor="middle" class="stage-ja">心理</text>

  <!-- arrow 6→7 -->
  <line x1="380" y1="232" x2="418" y2="232" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 7. clarify_prevention -->
  <rect x="420" y="200" width="160" height="64" rx="10" fill="#8B5CF6"/>
  <text x="500" y="226" text-anchor="middle" class="stage-en">clarify_prevention</text>
  <text x="500" y="246" text-anchor="middle" class="stage-ja">予防</text>

  <!-- arrow 7→8 -->
  <line x1="580" y1="232" x2="618" y2="232" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 8. wrap_up -->
  <rect x="620" y="200" width="160" height="64" rx="10" fill="#94A3B8"/>
  <text x="700" y="226" text-anchor="middle" class="stage-en">wrap_up</text>
  <text x="700" y="246" text-anchor="middle" class="stage-ja">終了</text>

  <!-- Stop box -->
  <rect x="740" y="120" width="130" height="52" rx="10" fill="#EF4444"/>
  <text x="805" y="142" text-anchor="middle" class="stage-en">stop</text>
  <text x="805" y="158" text-anchor="middle" class="stage-ja">安全停止</text>

  <!-- Dashed arrow from flow area to stop box -->
  <line x1="700" y1="104" x2="740" y2="130" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>

  <!-- "any stage" label on the dashed arrow -->
  <text x="696" y="122" text-anchor="end" class="stop-label">any stage →</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" fill="none">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <path d="M0 0 L10 3.5 L0 7 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <path d="M0 0 L10 3.5 L0 7 z" fill="#EF4444"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .stage-en { font-size: 10px; fill: rgba(255,255,255,0.8); }
    .stage-ja { font-size: 14px; fill: #fff; font-weight: 600; }
    .stop-label { font-size: 10px; fill: #EF4444; font-weight: 500; }
  </style>

  <!-- Row 1 boxes -->
  <!-- 1. intro -->
  <rect x="20" y="30" width="155" height="60" rx="10" fill="#94A3B8"/>
  <text x="97" y="55" text-anchor="middle" class="stage-en">intro</text>
  <text x="97" y="73" text-anchor="middle" class="stage-ja">導入・同意</text>

  <!-- arrow 1→2 -->
  <line x1="175" y1="60" x2="208" y2="60" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. narrative -->
  <rect x="210" y="30" width="155" height="60" rx="10" fill="#3B82F6"/>
  <text x="287" y="55" text-anchor="middle" class="stage-en">narrative</text>
  <text x="287" y="73" text-anchor="middle" class="stage-ja">自由語り</text>

  <!-- arrow 2→3 -->
  <line x1="365" y1="60" x2="398" y2="60" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. clarify_entry_point -->
  <rect x="400" y="30" width="155" height="60" rx="10" fill="#10B981"/>
  <text x="477" y="55" text-anchor="middle" class="stage-en">clarify_entry_point</text>
  <text x="477" y="73" text-anchor="middle" class="stage-ja">接触経緯</text>

  <!-- arrow 3→4 -->
  <line x1="555" y1="60" x2="588" y2="60" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. clarify_flow -->
  <rect x="590" y="30" width="155" height="60" rx="10" fill="#10B981"/>
  <text x="667" y="55" text-anchor="middle" class="stage-en">clarify_flow</text>
  <text x="667" y="73" text-anchor="middle" class="stage-ja">やりとり</text>

  <!-- Wrap arrow: row 1 end → row 2 start (routed through gap between rows) -->
  <path d="M745 60 L780 60 L780 130 L20 130 L20 168" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Row 2 boxes -->
  <!-- 5. clarify_harm -->
  <rect x="20" y="170" width="155" height="60" rx="10" fill="#F59E0B"/>
  <text x="97" y="195" text-anchor="middle" class="stage-en">clarify_harm</text>
  <text x="97" y="213" text-anchor="middle" class="stage-ja">被害状況</text>

  <!-- arrow 5→6 -->
  <line x1="175" y1="200" x2="208" y2="200" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6. clarify_psychology -->
  <rect x="210" y="170" width="155" height="60" rx="10" fill="#F59E0B"/>
  <text x="287" y="195" text-anchor="middle" class="stage-en">clarify_psychology</text>
  <text x="287" y="213" text-anchor="middle" class="stage-ja">心理</text>

  <!-- arrow 6→7 -->
  <line x1="365" y1="200" x2="398" y2="200" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 7. clarify_prevention -->
  <rect x="400" y="170" width="155" height="60" rx="10" fill="#8B5CF6"/>
  <text x="477" y="195" text-anchor="middle" class="stage-en">clarify_prevention</text>
  <text x="477" y="213" text-anchor="middle" class="stage-ja">予防</text>

  <!-- arrow 7→8 -->
  <line x1="555" y1="200" x2="588" y2="200" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 8. wrap_up -->
  <rect x="590" y="170" width="155" height="60" rx="10" fill="#94A3B8"/>
  <text x="667" y="195" text-anchor="middle" class="stage-en">wrap_up</text>
  <text x="667" y="213" text-anchor="middle" class="stage-ja">終了</text>

  <!-- Stop box (positioned to the right, between rows) -->
  <rect x="810" y="100" width="80" height="52" rx="10" fill="#EF4444"/>
  <text x="850" y="121" text-anchor="middle" class="stage-en">stop</text>
  <text x="850" y="138" text-anchor="middle" class="stage-ja">安全停止</text>

  <!-- Dashed arrows from both rows to stop box -->
  <line x1="745" y1="55" x2="808" y2="110" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <line x1="745" y1="205" x2="808" y2="142" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <text x="808" y="90" text-anchor="end" class="stop-label">any stage →</text>
</svg>

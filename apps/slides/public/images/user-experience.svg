<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500" fill="none">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.10"/>
    </filter>
    <filter id="shadowSm" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <clipPath id="phoneClip">
      <rect x="150" y="20" width="400" height="460" rx="28" ry="28"/>
    </clipPath>
  </defs>

  <!-- Phone frame -->
  <rect x="150" y="20" width="400" height="460" rx="28" ry="28" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>

  <!-- Status bar -->
  <rect x="150" y="20" width="400" height="28" rx="0" ry="0" fill="#FFFFFF" clip-path="url(#phoneClip)"/>
  <text x="350" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">9:41</text>
  <!-- Notch -->
  <rect x="305" y="20" width="90" height="14" rx="7" ry="7" fill="#1E293B"/>

  <!-- Header area -->
  <rect x="150" y="48" width="400" height="80" fill="#FFFFFF" clip-path="url(#phoneClip)"/>
  <line x1="150" y1="128" x2="550" y2="128" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Title -->
  <text x="350" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1E293B">AIインタビュー</text>

  <!-- Progress bar - 5 segments -->
  <!-- Segment 1 - filled -->
  <rect x="190" y="84" width="60" height="8" rx="4" ry="4" fill="#3B82F6"/>
  <!-- Segment 2 - filled -->
  <rect x="258" y="84" width="60" height="8" rx="4" ry="4" fill="#3B82F6"/>
  <!-- Segment 3 - filled -->
  <rect x="326" y="84" width="60" height="8" rx="4" ry="4" fill="#3B82F6"/>
  <!-- Segment 4 - empty -->
  <rect x="394" y="84" width="60" height="8" rx="4" ry="4" fill="#E2E8F0"/>
  <!-- Segment 5 - empty -->
  <rect x="462" y="84" width="60" height="8" rx="4" ry="4" fill="#E2E8F0"/>

  <!-- Progress labels -->
  <text x="220" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3B82F6" font-weight="600">概要</text>
  <text x="288" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3B82F6" font-weight="600">基本</text>
  <text x="356" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3B82F6" font-weight="600">詳細</text>
  <text x="424" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">背景</text>
  <text x="492" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">完了</text>

  <!-- Chat area background -->
  <rect x="150" y="128" width="400" height="252" fill="#F1F5F9" clip-path="url(#phoneClip)"/>

  <!-- AI label -->
  <text x="180" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#64748B" font-weight="600">AI</text>

  <!-- AI avatar circle -->
  <circle cx="185" cy="182" r="14" fill="#3B82F6"/>
  <text x="185" y="187" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#FFFFFF" font-weight="bold">AI</text>

  <!-- AI message bubble -->
  <rect x="206" y="168" width="280" height="60" rx="14" ry="14" fill="#DBEAFE" filter="url(#shadowSm)"/>
  <!-- Bubble tail -->
  <path d="M206 188 L196 184 L206 180" fill="#DBEAFE"/>
  <text x="220" y="190" font-family="system-ui, sans-serif" font-size="12.5" fill="#1E293B">
    <tspan x="220" dy="0">そのとき、どのような気持ちでしたか？</tspan>
    <tspan x="220" dy="18">覚えている範囲で教えてください。</tspan>
  </text>

  <!-- Typing indicator dots (subtle, below message) -->
  <circle cx="225" cy="252" r="3" fill="#94A3B8" opacity="0.5"/>
  <circle cx="235" cy="252" r="3" fill="#94A3B8" opacity="0.35"/>
  <circle cx="245" cy="252" r="3" fill="#94A3B8" opacity="0.2"/>

  <!-- Utility buttons row -->
  <rect x="150" y="380" width="400" height="40" fill="#FFFFFF" clip-path="url(#phoneClip)"/>
  <line x1="150" y1="380" x2="550" y2="380" stroke="#E2E8F0" stroke-width="1"/>

  <!-- "要約を見る" button -->
  <rect x="185" y="388" width="90" height="26" rx="13" ry="13" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="230" y="405" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">要約を見る</text>

  <!-- "会話ログ" button -->
  <rect x="285" y="388" width="80" height="26" rx="13" ry="13" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="325" y="405" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">会話ログ</text>

  <!-- Input area -->
  <rect x="150" y="420" width="400" height="60" fill="#FFFFFF" clip-path="url(#phoneClip)"/>
  <line x1="150" y1="420" x2="550" y2="420" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Text input field -->
  <rect x="175" y="430" width="240" height="36" rx="18" ry="18" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="195" y="452" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">回答を入力...</text>

  <!-- "スキップ" button -->
  <rect x="425" y="430" width="52" height="36" rx="10" ry="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="451" y="452" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#64748B" font-weight="500">スキップ</text>

  <!-- "送信" button -->
  <rect x="483" y="430" width="52" height="36" rx="10" ry="10" fill="#3B82F6"/>
  <text x="509" y="452" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#FFFFFF" font-weight="600">送信</text>

  <!-- Home indicator bar -->
  <rect x="310" y="470" width="80" height="4" rx="2" ry="2" fill="#CBD5E1"/>
</svg>
name = "my-worker"
main = "src/index.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
ENVIRONMENT = "production"

# ANTHROPIC_API_KEY is set via .dev.vars (local) or Workers secrets (production)

[[d1_databases]]
binding = "DB"
database_name = "my-database"
database_id = "local"
migrations_dir = "migrations"

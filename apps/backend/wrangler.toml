name = "ai-interview"
main = "src/index.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
ENVIRONMENT = "production"

# ANTHROPIC_API_KEY is set via .dev.vars (local) or Workers secrets (production)

[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ai-interview"
database_id = "042f6645-6d80-4c5e-b1fe-7210a4312b31"
migrations_dir = "migrations"
